name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Actions are pinned to commit SHAs; a tag like @v7 is mutable and whoever controls it controls
# this pipeline. Dependabot reads the version comment beside each SHA and opens a PR when it moves.
jobs:
  lint:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # dotnet-format is skipped here: the build job runs dotnet format --verify-no-changes with the SDK installed.
      - name: Run hooks on all files
        run: pipx run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: dotnet-format

  build:
    name: Build, test, pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer derives the version from tag history.
          fetch-depth: 0

      # Installs the SDK pinned in global.json.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --solution Pledge.slnx --configuration Release --no-build

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack --configuration Release --no-build --output artifacts/package

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg

  # Builds the docs site on every change so a broken link fails here, not at release time. Deploying is docs.yml's job.
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  aot:
    name: Native AOT publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            binary: BankAccount
          - os: windows-latest
            rid: win-x64
            binary: BankAccount.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Install native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev

      # TreatWarningsAsErrors turns every IL2xxx/IL3xxx trim or AOT warning into a build failure,
      # so a green run here is the "zero warnings attributable to the library" exit criterion.
      - name: Publish the sample with Native AOT
        run: dotnet publish samples/BankAccount --configuration Release --runtime ${{ matrix.rid }} --output artifacts/aot

      - name: Run the native binary
        run: ./artifacts/aot/${{ matrix.binary }}
        shell: bash
