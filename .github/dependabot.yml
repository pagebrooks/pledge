version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      roslyn-testing:
        patterns:
          - "Microsoft.CodeAnalysis.*.Testing"
      xunit:
        patterns:
          - "xunit*"
      # TUnit (engine) and TUnit.Core must stay on the same version; a split bump fails at test time.
      tunit:
        patterns:
          - "TUnit*"
    ignore:
      # Pinned to the oldest supported compiler on purpose; see Directory.Packages.props.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
